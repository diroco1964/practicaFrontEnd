<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración de caracteres -->
    <meta charset="UTF-8">
     <!-- Título de la pestaña -->
    <title>El Basurero del Ruido</title>
</head>
<body>
    <!-- Encabezado principal de la página -->
    <h1>El Basurero del Ruido</h1>

     <!-- Lista de enlaces -->
    <ul>
        <li><a href="#inicio">Inicio</a></li>
        <li><a href="#cassettes">Servicios</a></li>
        <li><a href="#fanzines">Fanzines</a></li>
        <li><a href="#contacto">Contacto</a></li>
        <li><a href="#intereses">Intereses</a></li>
    </ul>

    <h2 id="inicio">Inicio</h2>
    <p>Hazlo tu mismo.</p>

    <h2 id="casettes">Cassettes</h2>
    <p>Ediciones en Cinta Magnetica.</p>

    <h2 id="fanzines">Fanzines</h2>
    <p>Esta es la sección de Fanzines.</p>

     <h1 id="Contacto">Formulario de Contacto</h1>


     <!-- Formulario - label para campo -->
    <form>
        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre"><br><br>

        <label for="apellido">Apellido:</label><br>
        <input type="text" id="apellido" name="apellido"><br><br>

        <label for="correo">Correo electrónico:</label><br>
        <input type="email" id="correo" name="correo"><br><br>

        <button type="submit">Enviar</button>
        <button type="reset">Limpiar</button>
    </form>

    <form id="intereses">

         <p>Intereses:</p>
        <input type="checkbox" id="cassettes" name="intereses" value="cassettes">
        <label for="cassettes">Cassettes</label><br>

        <input type="checkbox" id="discos" name="intereses" value="discos">
        <label for="discos">Discos</label><br>

        <input type="checkbox" id="fanzines" name="intereses" value="fanzines">
        <label for="fanzines">Fanzines</label><br><br>

        <label for="pais">País:</label><br>
        <select id="pais" name="pais">
            <option value="argentina">Argentina</option>
            <option value="uruguay">Uruguay</option>
            <option value="chile">Chile</option>
        </select><br><br>

        <button type="submit">Enviar</button>
    </form>

</body>
</html>
